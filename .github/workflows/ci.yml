name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  windows:
    name: Windows (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: windows-latest
            msystem: UCRT64
            arch: ucrt-x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout ditty
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout boba (dependency)
        uses: actions/checkout@v5
        with:
          repository: chestso/boba
          # Pinned: bump alongside the ditty commit that consumes a new boba
          # API or behavior (currently the inline textinput, the completion
          # popup, and the runtime/msg/cmd surface the REPL drives). A
          # floating master would let boba churn break this repo's CI
          # mid-work - dropping the bundled CharmTone palette is what broke
          # the 2026-10-11 run. NOTE: this tag must exist on the boba remote
          # BEFORE ditty, or CI cannot fetch it. Bump it in both platform
          # jobs at once.
          ref: v0.5.4
          path: boba
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            git
            mingw-w64-${{ matrix.arch }}-toolchain
            autoconf
            automake
            libtool
            make
            pkg-config
            mingw-w64-${{ matrix.arch }}-gc
            mingw-w64-${{ matrix.arch }}-pcre2
            zip
            p7zip

      - name: Build & install boba
        working-directory: boba
        run: |
          ./autogen.sh
          mkdir build && cd build
          sh ../configure --prefix="$MINGW_PREFIX"
          make -j"$(nproc)"
          make check
          make install

      - name: Build ditty
        run: |
          ./autogen.sh
          mkdir build && cd build
          sh ../configure --enable-release
          make -j"$(nproc)"

      - name: Run tests
        run: make -C build check VERBOSE=1

      - name: Build portable ZIP
        run: make -C build dist-portable

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ditty-windows-${{ matrix.label }}
          path: ditty-*-windows-*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout ditty
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout boba (dependency)
        uses: actions/checkout@v5
        with:
          repository: chestso/boba
          # Pinned: bump alongside the ditty commit that consumes a new boba
          # API or behavior (currently the inline textinput, the completion
          # popup, and the runtime/msg/cmd surface the REPL drives). A
          # floating master would let boba churn break this repo's CI
          # mid-work - dropping the bundled CharmTone palette is what broke
          # the 2026-10-11 run. NOTE: this tag must exist on the boba remote
          # BEFORE ditty, or CI cannot fetch it. Bump it in both platform
          # jobs at once.
          ref: v0.5.4
          path: boba
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config \
            bdw-gc pcre2 librsvg

      - name: Build & install boba
        working-directory: boba
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$(brew --prefix)" --enable-release
          make -j"$(sysctl -n hw.ncpu)"
          make check
          make install

      - name: Build ditty
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure --enable-release
          make -j"$(sysctl -n hw.ncpu)"

      - name: Run tests
        run: make -C build check VERBOSE=1

      - name: Build portable .app
        run: make -C build dist-app

      - name: Upload portable .app
        uses: actions/upload-artifact@v7
        with:
          name: ditty-macos-${{ matrix.arch }}
          path: ditty-*-macos-*.zip
          if-no-files-found: error
          retention-days: 30
